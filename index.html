<title>世界のミカタ ── 見えない世界と、受けとるしくみ</title>
<meta name="description" content="世界のミカタ。欅の下で世界の層、環世界、碧の受けとり方、知覚と意味を一つの3D体験でたどる。人・ハチ・コウモリの手がかりを比べ、自分の感覚も試す。mitsulab">
<meta property="og:title" content="世界のミカタ（mitsulab）">
<meta property="og:description" content="紫外線で花の的、赤外線で体の熱と葉の涼しさ、超音波で夜の声の地図、足もとを流れる地下水、見えない空気の流れ、根と菌のやりとり。届いたもののほんの一部が意味になるまでを 3D で。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mitsulab-soil.github.io/aoi-blueprint/">
<meta name="twitter:card" content="summary_large_image">

<!--
  世界のミカタ（2026-10-09 名を改め、見えない世界のレンズと地形・土の断面を足した。姉妹作＝aoi.html 碧のミカタ。旧 Aoi Sense は 旧ver/。URL とリポジトリ名 aoi-blueprint は据え置き）
  ・表示名は names.json の一か所（script.py が data/script.js に入れる）。文と碧の台本の正は _dev/script.py。
  ・二つの焦点：世界の側（受けとられる前の物理の層）と、受けとる側（人と碧）。同じ欅の下を、表と裏として行き来する。
  ・受けとるまで：世界 → 感覚器 → 信号 → 注意 → 記憶と予測 → 処理の容量 → 知覚と意味。粒は模式で、数は実際の量ではない。
  ・試す：見る（盲点・変化の見落とし）・聴く・ふれる・嗅ぐ・味わう・体の内側。記録は保存しない。
  ・碧の声＝VOICEVOX:冥鳴ひまり（字幕＝声の文）。試すところの音は、その場で作る音だけ。
  ・three@0.170.0 と @pixiv/three-vrm@3.5.5 は jsDelivr の版固定。
-->

<style>
:root{
  color-scheme:dark;
  --bg:#03070d; --ink:#eef6fb; --ink-2:#c3cedd; --ink-3:#8b98ae;
  --aoi:#5cc8e0; --aoi-2:#a6e4f2; --leaf:#8fe3b0; --warm:#f0c27a; --uv:#a98cff;
  --line:rgba(92,200,224,.34); --line-2:rgba(140,190,230,.16);
  --glass:rgba(5,13,22,.78);
  --serif:"Shippori Mincho","Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"IBM Plex Sans","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --navh:58px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-text-size-adjust:100%}
body{background:radial-gradient(120% 90% at 50% 30%,#0a1726 0%,#04090f 60%,#020509 100%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--aoi-2);outline-offset:2px}
a{color:var(--aoi-2)}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.lb{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;font-size:12px;letter-spacing:.04em;color:var(--ink-2);
  padding:2px 7px;border-left:1px solid var(--line);background:rgba(3,8,14,.42);transition:opacity .4s,color .4s;will-change:transform}
.lb b{font-weight:500;color:var(--ink)}
.lb i{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-left:6px}
.lb .why{display:none}
.lb.lit{border-left-color:var(--warm);color:var(--ink)} .lb.lit b{color:var(--warm)}
.lb.off{color:var(--ink-3);border-left:2px solid var(--warm);background:rgba(40,22,8,.55)} .lb.off b{color:var(--warm);text-decoration:line-through;text-decoration-color:var(--warm);text-decoration-thickness:2px}
.lb.off i{display:none} .lb.off .why{display:inline;margin-left:8px;font-size:12px;color:#f5d9a8}
#card ul.gone{list-style:none;padding:0;margin:4px 0 10px;display:flex;flex-wrap:wrap;gap:6px}
#card ul.gone li{font-size:12px;line-height:1.5;padding:4px 8px;border:1px solid rgba(240,194,122,.45);border-radius:6px;background:rgba(240,194,122,.07);color:var(--ink-2)}
#card ul.gone s{color:var(--warm);text-decoration-thickness:2px;margin-right:6px}
.lb.gate{pointer-events:auto;cursor:pointer;border:1px solid var(--line);border-radius:3px;transform:translate(-50%,0)}
.lb.gate.cur{color:var(--ink);border-color:var(--aoi);background:rgba(10,40,56,.62)}
.pt{position:absolute;left:0;top:0;pointer-events:auto;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink);
  padding:4px 8px 4px 4px;border-radius:999px;background:rgba(3,10,18,.6);border:1px solid var(--line);min-height:32px}
.pt:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--aoi);box-shadow:0 0 10px var(--aoi);margin-left:4px}
.pt.on{background:rgba(14,52,70,.85);border-color:var(--aoi-2)}

header{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 0;pointer-events:none}
header>*{pointer-events:auto}
.ttl{margin:0;font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:.06em;line-height:1.25}
.sw{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-2);border-radius:999px;padding:3px;background:rgba(3,10,18,.55)}
.sw>*{padding:5px 12px;border-radius:999px;font-size:17px;text-decoration:none;color:var(--ink-3);min-height:34px;display:inline-flex;align-items:center}
.sw .on{color:var(--ink);background:rgba(92,200,224,.16)} .sw a:hover{color:var(--aoi-2)} .sw .ar{padding:0 2px;font-family:var(--mono);font-size:12px;min-height:0}
.subt{margin-left:6px}
.ttl .pair{color:var(--aoi-2)}
.ttl .sl{color:var(--ink-3);margin:0 .1em}
.subt{display:block;font-family:var(--sans);font-weight:300;font-size:11.5px;letter-spacing:.08em;color:var(--ink-3);margin-top:2px}
.hb{display:flex;gap:6px}
.hb button{font-size:12px;padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:rgba(3,10,18,.55);color:var(--ink-2);min-height:34px}
.hb button[aria-pressed="false"]{color:var(--ink-3);border-style:dashed}
#tabs{position:fixed;z-index:5;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top));display:flex;gap:2px;padding:3px;border:1px solid var(--line-2);border-radius:999px;background:rgba(3,10,18,.6)}
#tabs button{font-size:13px;padding:7px 14px;border-radius:999px;color:var(--ink-3);letter-spacing:.04em;min-height:34px}
#tabs button[aria-selected="true"]{background:rgba(92,200,224,.18);color:var(--ink)}
#flip{position:fixed;z-index:5;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top));display:none;align-items:center;gap:0;border:1px solid var(--line);border-radius:999px;background:rgba(3,10,18,.7);padding:3px}
#flip.show{display:flex}
#flip button{font-size:13.5px;padding:8px 16px;border-radius:999px;color:var(--ink-3);min-height:36px;letter-spacing:.05em}
#flip button[aria-pressed="true"]{color:var(--bg);background:var(--aoi-2)}
#flip .ar{font-family:var(--mono);color:var(--ink-3);font-size:12px;padding:0 4px}

#card{position:fixed;z-index:4;right:16px;top:112px;max-height:calc(100vh - 112px - var(--navh) - 96px - env(safe-area-inset-bottom));width:min(390px,34vw);overflow:auto;
  padding:16px 18px 18px;background:var(--glass);border:1px solid var(--line-2);border-radius:10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  scrollbar-width:thin;transition:opacity .35s}
#card.hide{opacity:0;pointer-events:none}
.ck{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--aoi);text-transform:uppercase}
#card h2{font-family:var(--serif);font-weight:600;font-size:21px;margin:4px 0 8px;letter-spacing:.04em}
#card .lead{color:var(--ink-2);font-size:14px;margin:0 0 10px;line-height:1.75}
#card .row{margin:10px 0;font-size:13.5px;line-height:1.8;color:var(--ink-2)}
#card .row .k{display:inline-block;font-size:11px;letter-spacing:.1em;color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:0 6px;margin-right:6px;vertical-align:1px}
#card .row.aoi .k{color:var(--aoi-2);border-color:var(--aoi)}
#card ul{margin:6px 0;padding-left:1.1em;color:var(--ink-2);font-size:13.5px;line-height:1.8}
#card .q{margin:14px 0 4px;padding:10px 12px;border-left:2px solid var(--warm);background:rgba(240,194,122,.06);font-family:var(--serif);font-size:15.5px;line-height:1.75;color:var(--ink)}
#card details{margin-top:12px;font-size:12px;color:var(--ink-3);line-height:1.7}
#card summary{cursor:pointer;color:var(--ink-3);letter-spacing:.08em;min-height:28px}
#card details li{margin:4px 0}
#card .links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
#card .links a{font-size:12.5px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;text-decoration:none}
#card .back{font-size:12px;color:var(--ink-3);border:1px solid var(--line-2);border-radius:999px;padding:5px 10px;margin-bottom:8px;min-height:30px}
#cardT{display:none}

#sub{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + 18px + env(safe-area-inset-bottom));width:min(720px,calc(100vw - 32px));
  text-align:center;font-size:16px;line-height:1.7;letter-spacing:.03em;color:var(--ink);text-shadow:0 1px 6px #000,0 0 2px #000;min-height:1.7em;pointer-events:none}
#sub .who{font-family:var(--mono);font-size:10.5px;color:var(--aoi);letter-spacing:.14em;margin-right:8px;vertical-align:2px}
#sub.talk .who:after{content:" ●";animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
nav#nav{position:fixed;z-index:6;left:0;right:0;bottom:0;height:calc(var(--navh) + env(safe-area-inset-bottom));padding:0 12px env(safe-area-inset-bottom);
  display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(to top,rgba(2,6,11,.92),rgba(2,6,11,.55));border-top:1px solid var(--line-2)}
nav#nav button.nb{width:46px;height:42px;border:1px solid var(--line);border-radius:8px;font-size:18px;color:var(--ink-2)}
nav#nav button.nb:disabled{opacity:.3}
#where{min-width:0;flex:0 1 360px;text-align:center;font-size:13px;color:var(--ink-2);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#where .n{font-family:var(--mono);color:var(--ink-3);font-size:11px;margin-right:6px}
#again{font-size:12px;padding:6px 10px;border:1px solid var(--line-2);border-radius:999px;color:var(--ink-3);min-height:34px}

#ctl{position:fixed;z-index:6;left:16px;right:calc(min(390px,34vw) + 32px);pointer-events:none;bottom:calc(var(--navh) + 84px + env(safe-area-inset-bottom));display:none;flex-wrap:wrap;justify-content:center;gap:6px;max-width:calc(100vw - 32px)}
#ctl.show{display:flex}
#ctl>*{pointer-events:auto}
#ctl button{font-size:13px;padding:8px 13px;border:1px solid var(--line);border-radius:999px;background:rgba(3,10,18,.9);color:var(--ink-2);min-height:38px}
#ctl button[aria-pressed="true"]{background:rgba(240,194,122,.16);border-color:var(--warm);color:var(--ink)}
#ctl .lab{font-size:11px;color:var(--ink-3);align-self:center;letter-spacing:.08em;margin-right:2px}
#ctl button.go{background:rgba(10,44,58,.94);border-color:var(--aoi);color:var(--ink)}
#hud{position:fixed;z-index:3;left:16px;top:118px;font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.06em;display:none;line-height:1.7;pointer-events:none}
#hud.show{display:block}
#hud b{color:var(--ink-2);font-weight:500}

/* 試す：パネル */
#trial{position:fixed;z-index:4;left:16px;top:118px;width:min(520px,calc(100vw - 32px - min(390px,34vw) - 24px));display:none;
  background:var(--glass);border:1px solid var(--line-2);border-radius:10px;padding:14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#trial.show{display:block}
#trial .tt{font-size:12px;color:var(--ink-3);letter-spacing:.08em;margin-bottom:8px}
#trial canvas{display:block;width:100%;border-radius:6px}
#trial .meter{margin:10px 0 2px}
#trial .meter .lb2{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2)}
#trial .bar{height:10px;border-radius:5px;background:rgba(140,190,230,.12);overflow:hidden;margin-top:4px}
#trial .bar i{display:block;height:100%;background:var(--aoi);border-radius:5px;transition:width .5s}
#trial .bar.w i{background:var(--warm)}
#trial input[type=range]{width:100%;accent-color:var(--aoi);height:32px}
#trial .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#trial .two .cell{border:1px solid var(--line-2);border-radius:6px;padding:8px;text-align:center}
#trial .two .cell .nm{font-size:12px;color:var(--ink-3)}
#trial .two .cell .vv{font-family:var(--serif);font-size:17px;margin-top:4px}
#trial .big{font-family:var(--serif);font-size:20px;text-align:center;margin:10px 0 4px}
#trial .note{font-size:12px;color:var(--ink-3);line-height:1.7;margin-top:8px}
#ring{display:block;margin:6px auto;width:120px;height:120px}
#blank{position:fixed;inset:0;z-index:1;background:#5b6470;display:none;pointer-events:none}
#blank.on{display:block}

/* はじめ */
#start{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(80% 70% at 50% 40%,rgba(8,22,36,.72),rgba(2,5,9,.94))}
#start.gone{opacity:0;pointer-events:none;transition:opacity .6s}
#start .in{max-width:560px;text-align:center}
#start h1{font-family:var(--serif);font-weight:600;font-size:clamp(28px,7vw,44px);letter-spacing:.08em;margin:0;line-height:1.35}
#start h1 .pair{color:var(--aoi-2)}
#start h1 .sl{color:var(--ink-3);font-weight:500}
#start .s{font-family:var(--serif);color:var(--ink-2);font-size:16px;margin:12px 0 20px;letter-spacing:.08em}
#start p{color:var(--ink-2);font-size:14px;line-height:1.9;margin:0 0 22px}
#start .bt{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#start .bt button{font-size:15px;padding:12px 22px;border-radius:999px;border:1px solid var(--aoi);min-height:46px;letter-spacing:.06em}
#start .bt button.p{background:var(--aoi-2);color:var(--bg);border-color:var(--aoi-2)}
#start .ld{margin-top:18px;font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.1em;min-height:1.4em}
#start .ops{margin-top:6px;font-size:12px;color:var(--ink-3);line-height:1.8}

/* 典拠 */
#refs{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(1,4,8,.78)}
#refs.show{display:flex}
#refs .in{max-width:760px;width:100%;max-height:86vh;overflow:auto;background:#06101b;border:1px solid var(--line);border-radius:10px;padding:18px 20px}
#refs h2{font-family:var(--serif);font-size:20px;margin:0 0 10px}
#refs h3{font-size:13px;color:var(--aoi-2);letter-spacing:.08em;margin:16px 0 6px}
#refs li{font-size:12.5px;line-height:1.75;color:var(--ink-2);margin:4px 0}
#refs p{font-size:12.5px;line-height:1.8;color:var(--ink-2)}
#refs .x{float:right;font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;min-height:34px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* スマホ */
@media (max-width:760px){
  :root{--navh:54px}
  header{padding:calc(8px + env(safe-area-inset-top)) 12px 0}
  .ttl{font-size:15px}
  .sw>*{font-size:14px;padding:4px 9px;min-height:32px} .subt{display:none}
  .subt{font-size:10.5px}
  .hb button{padding:6px 9px;font-size:11.5px;min-height:32px}
  #tabs{top:calc(56px + env(safe-area-inset-top));left:12px;right:12px;transform:none;justify-content:space-between;max-width:calc(100vw - 24px);overflow-x:auto}
  #tabs button{flex:1 0 auto;padding:7px 7px;font-size:11px;white-space:nowrap;letter-spacing:0}
  #flip{top:calc(100px + env(safe-area-inset-top))}
  #flip button{padding:6px 12px;font-size:12.5px;white-space:nowrap;min-height:32px}
  #card{left:10px;right:10px;width:auto;top:auto;bottom:calc(var(--navh) + 8px + env(safe-area-inset-bottom));max-height:44vh;padding:12px 14px 14px;border-radius:10px}
  #card.min .full{display:none}
  #card ul.gone{gap:4px;margin:2px 0 6px} #card ul.gone li{font-size:11px;padding:2px 6px} #card.min ul.gone li span{display:none}
  #cardT{display:block;position:absolute;right:8px;top:8px;font-size:12px;color:var(--ink-3);border:1px solid var(--line-2);border-radius:999px;padding:5px 10px;min-height:30px;background:rgba(3,10,18,.6)}
  #card h2{font-size:18px;margin:2px 70px 6px 0}
  #card .q{font-size:14.5px;margin-top:8px}
  #sub{bottom:auto;top:calc(144px + env(safe-area-inset-top));font-size:14.5px;width:calc(100vw - 24px)}
  #ctl{left:12px;right:12px;bottom:calc(var(--navh) + 12px + env(safe-area-inset-bottom) + var(--cardh,120px))}
  #ctl button{padding:7px 10px;font-size:12.5px;min-height:36px;white-space:nowrap}
  #hud{top:calc(102px + env(safe-area-inset-top));left:14px;font-size:10px;line-height:1.5}
  #ctl .lab{display:none}
  #trial{left:10px;right:10px;width:auto;top:calc(144px + env(safe-area-inset-top));padding:10px}
  body.trialOn #sub{top:auto;bottom:calc(var(--navh) + 60px + env(safe-area-inset-bottom) + var(--cardh,120px));}
  #where{font-size:12px}
  #again{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="cv" aria-hidden="true"></canvas>
<div id="labels"></div>
<div id="blank"></div>

<header>
  <div>
    <p class="ttl" id="ttl"></p>
    <span class="subt" id="subt"></span>
  </div>
  <div class="hb">
    <button id="bVoice" aria-pressed="true" title="碧の声">声</button>
    <button id="bRefs">典拠</button>
  </div>
