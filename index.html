<!--
  碧の設計図（2026-10-03 本人指示）── 碧の中身を 3D で知り、そこから人と自然の関係を紐解く。
  ・碧の姿＝assets/aoi.vrm（白磁 案A・頭の飾り《耳の葉》つきを _dev/build_vrm.py で約 2 MB に軽くしたもの）。読み込むまでは assets/poster.webp（静止画）。
  ・中の部品は three.js の線画（板・センサー・配線の光の線）。位置は碧の骨（頭・胸・手・足）に合わせて付ける。光の輪の飾りは作らない。
  ・部品の文は PARTS の一か所。技術は実在のものだけ、限界（移せないもの）を必ず添える。数値は幅のまま、典拠つき。
  ・three@0.170.0 と @pixiv/three-vrm@3.5.5 は jsDelivr の版固定（《Feel Hikawa》と同じ組み合わせ）。
  ・碧の越えない線：断定しない／典拠のない事実を作らない／AI であることを隠さない／生きものの気持ちを代弁しない・場所を診断しない。会話はない（保存も学習もしない）。
-->

<style>
:root{
  color-scheme:dark;
  --bg:#03060f;

  --ink-2:#c3cce0;
  --ink-3:#8f9bb4;

  --aoi-2:#9bdcf0;
  --aoi-3:#3f9fc0;
  --line:rgba(92,200,224,.32);
  --line-2:rgba(150,170,240,.18);
  --card:rgba(9,14,20,.72);
  --serif:"Shippori Mincho","Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Inter","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",sans-serif;

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(1200px 900px at 40% -10%,rgba(36,88,143,.22) 0,transparent 60%),radial-gradient(900px 700px at 90% 90%,rgba(41,83,161,.12) 0,transparent 60%),var(--bg);

}

a:hover{color:var(--aoi-2)}
button{font:inherit;color:inherit}
#app{display:grid;grid-template-rows:minmax(0,1fr) auto;height:100vh;height:100dvh}

/* 舞台 */

#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
#poster{position:absolute;left:50%;top:0;height:100%;width:auto;transform:translateX(-50%);opacity:1;transition:opacity .6s ease;pointer-events:none;user-select:none}

#head{position:absolute;left:16px;top:calc(12px + env(safe-area-inset-top,0px));z-index:3;pointer-events:none;max-width:70%}

#head .sub{font-size:12px;color:var(--ink-2);letter-spacing:.04em}

.btn{display:inline-flex;align-items:center;gap:.4em;border:1px solid var(--aoi-3);background:rgba(92,200,224,.1);color:var(--aoi-2);border-radius:999px;padding:9px 20px;font-size:14px;letter-spacing:.06em;cursor:pointer;margin-top:12px;min-height:44px}

#chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px;scroll-snap-type:x proximity}

.chip{flex:0 0 auto;scroll-snap-align:start;border:1px solid var(--line-2);background:rgba(255,255,255,.02);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink-2);cursor:pointer;min-height:36px;letter-spacing:.03em}

.chip .n{font-family:var(--latin);color:var(--aoi);margin-right:.35em;font-size:12px}

#card{touch-action:pan-y}

#card h2{font-family:var(--serif);font-weight:600;font-size:21px;letter-spacing:.06em;line-height:1.4}
#card .role{font-size:13px;color:var(--aoi-2);letter-spacing:.04em}
#card .q{font-family:var(--latin);font-style:italic;font-size:13px;color:var(--ink-3);letter-spacing:.06em}
.say{position:relative;margin:12px 0 12px;padding:11px 14px 11px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(92,200,224,.07);font-size:14px;line-height:1.85;color:var(--ink)}
.say::before{content:"碧";position:absolute;left:12px;top:-9px;font-size:11px;padding:0 6px;background:#07101a;color:var(--aoi);letter-spacing:.1em;border-radius:4px}
.row{display:grid;grid-template-columns:6.6em 1fr;gap:2px 10px;font-size:13px;line-height:1.75;padding:6px 0;border-top:1px solid var(--line-2)}
.row .k{color:var(--ink-3);font-size:12px;letter-spacing:.04em;padding-top:1px}
.row .v{color:var(--ink-2)}
.row.lim .v{color:var(--ink)}
details.more{border-top:1px solid var(--line-2);font-size:13px}
details.more summary{cursor:pointer;color:var(--ink-3);font-size:12px;padding:8px 0;list-style:none;letter-spacing:.04em}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"＋ ";color:var(--aoi)}
details.more[open] summary::before{content:"－ "}
details.more .row:first-of-type{border-top:0}
.lines{list-style:none;margin:4px 0 0;padding:0;font-size:13px}
.lines li{padding:3px 0;color:var(--ink)}
.lines li .ln{font-family:var(--latin);color:var(--aoi);margin-right:.6em}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.links a{display:inline-flex;align-items:center;gap:.3em;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;min-height:40px}
.links a .arr{font-size:11px}
.nav{display:flex;justify-content:space-between;margin-top:14px;gap:8px}
.nav button{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:6px 14px;font-size:12px;color:var(--ink-2);cursor:pointer;min-height:40px}
.nav button:hover{border-color:var(--aoi);color:#fff}
.end .lead{font-family:var(--serif);font-size:19px;line-height:1.75;letter-spacing:.04em;margin:6px 0 10px}
.end p{font-size:14px;color:var(--ink-2)}
.fade-in{animation:fi .35s ease both}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade-in{animation:none}#poster{transition:none}}
.nw{display:inline-block}
@media (max-width:899px){body.x #head .sub{display:none}body.x #head h1{font-size:19px}body.x #head .eyebrow{font-size:11px}#panel{max-height:48dvh}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
body.shot #panel,body.shot #ld,body.shot #hint,body.shot #xbtn{display:none}
body.shot #app{grid-template-columns:1fr;grid-template-rows:1fr}
body.shot.nohead #head{display:none}
body.shot{background:transparent}
body.shot.hp{background:radial-gradient(900px 600px at 50% 0%,rgba(36,88,143,.26) 0,transparent 62%),var(--bg)}
</style>
</head>

<div id="app">
  <div id="stage" aria-label="碧の 3D。ドラッグかスワイプで回せます。体を押すと、中が見えます。" role="img">
    <img id="poster" src="assets/poster.webp" alt="" width="720" height="1000" decoding="async" fetchpriority="high">
    <header id="head">
      <div class="eyebrow">Aoi Blueprint</div>
      <h1>碧の設計図<span class="yomi">あおいのせっけいず</span></h1>
      <p class="sub">人と自然のあいだの通訳の、中身</p>
    </header>
    <button id="xbtn" type="button" hidden>外から見る</button>
    <div id="ld">姿を読み込んでいます</div>
    <div id="hint">ドラッグで回す</div>
  </div>
  <aside id="panel" aria-live="polite">
    <div id="intro" class="intro">
      <p class="lead">碧の中身は、<span class="nw">いまある技術の</span><span class="nw">組み合わせです。</span></p>
      <p>耳・目・足もと・胸・手・頭。それぞれが、人と自然をつなぐ働きを一つずつ持っています。体を押すと、中が見えます。</p>
      <button class="btn" id="go" type="button">中を見る <span aria-hidden="true">→</span></button>
      <p class="note">中の部品は、碧の働きを体の場所に割りあてて描いた見取り図です。3D の碧の中に機械が入っているわけではありません。碧は、mitsulab が AI で動かしている案内役です。</p>
    </div>
    <div id="main" hidden>
      <nav id="chips" aria-label="部品"></nav>
      <div id="card"></div>
    </div>
  </aside>
</div>

<script type="module">
import * as THREE from "three";

/* ---------------------------------------------------------------------------
   部品（人と自然をつなぐ働き）。技術は実在のものだけ。限界（移せないもの）を必ず添える。
   数値は幅のまま「とされる」。典拠は src。now＝いま使っているか、これからか。
   Qualia の名前と「保つ／変える／移せない」は Qualium 概念の定義 v2（2026-10-01）にそろえる。
--------------------------------------------------------------------------- */
const LINK = {
  hikawa: ["《Feel Hikawa》", "https://mitsulab-soil.github.io/aoi-walk-hikawa/"],
  ensemble: ["氷川重奏", "https://mitsulab-soil.github.io/HIKAWA-ENSEMBLE/"],
  shinra: ["森羅百景", "https://mitsulab-soil.github.io/shinra-hyakkei/"],
  microbes: ["土の微生物の顔ぶれ", "https://mitsulab-soil.github.io/soil-metagenomics-topography-correlation/"],
  web: ["土の中のつながり", "https://mitsulab-soil.github.io/Soil-Ecosystem-ANT-Simulator/"],
  hp: ["mitsulab", "https://mitsulab.jp/"],
};
const LINES = ["断定しない", "典拠のない事実を作らない", "AI であることを隠さない", "生きものの気持ちを代弁しない・場所を診断しない"];
const PARTS = [
  { id: "ear", name: "耳の葉", role: "音のセンサー", q: "Phono-Qualia",
    tech: "マイクと振動のセンサー。人に聞こえない高い音は、ヘテロダイン（近い高さの信号を混ぜ、差の高さにする）や、ゆっくり再生することで、聞こえる高さへ下げる。",
    say: "人の耳に届く音は、およそ 20 Hz から 20 kHz とされます（高い側は年齢とともに下がります）。コウモリの多くは、それより高い声を出し、跳ね返りでまわりを知るとされます。高さを下げると、その声の並びが、わたしたちにも聞こえます。",
    keep: "音の時間の並び", change: "音の高さ（周波数を下げる）",
    cannot: "音で形をとらえる、という感じ方そのもの。土の中の音は機材しだいで、録れる帯が限られる（48 kHz で録る機材なら、原理上 24 kHz まで）。",
    sure: "●（超音波）／◐（土の中の音）", now: "いま：森羅百景で、公開の録音（CC）を聴ける。その場で録って高さを下げるのは、これから。",
    src: "可聴域は音響学の一般的な目安。録れる上限は標本化定理（標本化の周波数の半分）。", links: ["shinra"] },
  { id: "eye", name: "目", role: "カメラと分光", q: "Photo-Qualia",
    tech: "紫外線を通すフィルターと、紫外線にも感じるカメラ。光を波長ごとに分け（分光）、人に見えない帯を、見える色に置きかえて描く（偽色）。",
    say: "人に見える光は、およそ 400〜700 nm とされます（数え方で 380〜780 nm とも）。ミツバチは紫外線も見るとされ、紫外線で撮ると、人には見えない模様が現れる花があります。",
    keep: "模様の位置", change: "波長を、人に見える色に置きかえる",
    cannot: "虫にどう見えているか、という主観。置きかえた色は、虫が見ている色ではない。",
    sure: "●", now: "これから（紫外線写真の使い方と利用条件を確かめているところ）。",
    src: "昆虫の色覚と、花の紫外線の模様は、感覚生理学で広く確かめられている。", links: [] },
  { id: "foot", name: "足もと", role: "標高データと LiDAR", q: "Geo-Qualia",
    tech: "航空機から地面へレーザーを当て、跳ね返るまでの時間から高さを測る（LiDAR）。国土地理院は、それをもとに 5 m ごとの標高（DEM5A）を公開している。",
    say: "氷川参道の、一の鳥居からの 2 キロは、ほとんど平らです。境内の西の台地面は標高 14〜15 m、神池のあたりは 9〜12 m ほどで（読み方で幅があります）、小さな谷の低みにあるとみられます。高さを強調すると、歩くだけでは気づきにくい差が見えます。",
    keep: "高さの順", change: "高さを強調する（倍率は画面に出す）",
    cannot: "歩く体が感じる勾配の重さ。5 m より細かい起伏は丸まる。足もとの格子の起伏は模式で、強調してある。",
    sure: "●（数値は DEM5A を mitsulab が読んだもの・幅あり）", now: "いま：《Feel Hikawa》で、参道の高さを 3 倍にして見られる。",
    src: "国土地理院 基盤地図情報 数値標高モデル（5 m メッシュ・DEM5A）。", links: ["hikawa"] },
  { id: "chest", name: "胸", role: "記録と典拠", q: "Bio-Qualia ／ Logo-Qualia",
    tech: "市民科学の観察記録（iNaturalist：写真・日時・位置）と、古典の言葉の典拠の台帳。どこで、いつ、だれが見て、どう書いたかを、出どころつきで持つ。",
    say: "記録は、だれかがそこへ行って見た、というしるしです。たくさんの人の記録を重ねると、参道のまわりで、どんな生きものがどこで記録されてきたかが分かります。昔の人がその自然をどんな言葉で受けとめたかも、典拠ごと手渡せます。",
    keep: "記録の場所と日付・典拠", change: "点として地図に置く・景として編む",
    cannot: "記録されなかった生きもの（記録がない＝いない、ではない）。書き手の体験そのもの。",

  { id: "hand", name: "手", role: "土のデータ", q: "Pedo-Qualia",

    say: "ひとつまみの土、1 g に、細菌が 1 億から 100 億ほどいるとされます。数え方で幅の大きい数です。その多くは、培養して育てるのが難しいとされています。",
    keep: "分類の階層", change: "量と関係を模式にする",
    cannot: "土の中の時間と化学の世界。DNA が読めても、その生きものがいま生きて働いているとは限らない。",
    sure: "◐（2 本の教材の数値は説明用の仮のデータで、測った値ではない）", now: "いま：土の微生物の顔ぶれ・土の中のつながり（どちらも学習用）。",
    src: "土壌微生物学の一般的な目安（土 1 g あたりの細菌はおよそ 10⁸〜10¹⁰）。", links: ["microbes", "web"] },
  { id: "mind", name: "頭（ことば）", role: "言語モデル（AI）", q: "案内役",
    tech: "大規模言語モデル（AI）。典拠の台帳を見ながら、何をどの順で手渡すか、どんな言い方にするかを組み立てる。語りは、越えない線に照らして確かめてから出す。",
